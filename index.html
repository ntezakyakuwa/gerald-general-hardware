<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GERALD GENERAL HARDWARE — Online Order</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#17202a;color:#fff;padding:22px 16px;position:sticky;top:0;z-index:5}
.wrap{max-width:1050px;margin:auto}.brand{font-size:25px;font-weight:800}.tag{margin-top:5px;color:#d7dee5}
.controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.controls input,.controls select{padding:12px;border-radius:9px;border:1px solid #cbd3da;flex:1;min-width:180px}
main{padding:22px 16px 110px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e0e5e9;border-radius:13px;padding:15px;box-shadow:0 2px 8px #0000000a}
.cat{font-size:12px;text-transform:uppercase;color:#68737d;font-weight:700}.name{font-weight:700;font-size:17px;margin:7px 0}.price{font-weight:800;font-size:18px;margin:8px 0 12px}
button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.add{background:#f4b400;color:#111;width:100%}.qty{display:flex;gap:8px;align-items:center}.qty button{background:#e9eef2}.qty span{min-width:24px;text-align:center;font-weight:800}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d8dee3;padding:12px 16px;z-index:6}.cartinner{max-width:1050px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.checkout{background:#16803c;color:#fff}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:18px;overflow:auto}.panel{background:#fff;max-width:650px;margin:30px auto;border-radius:15px;padding:20px}.row{display:flex;justify-content:space-between;gap:12px;margin:10px 0}.form input,.form textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd4db;border-radius:8px}.small{font-size:13px;color:#68737d}
@media(max-width:600px){.brand{font-size:21px}.grid{grid-template-columns:1fr 1fr}.card{padding:12px}.price{font-size:16px}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand">GERALD GENERAL HARDWARE</div>
<div class="tag">Building • Construction • Plumbing • Welding • Farming Materials</div>
<div class="controls">
<input id="search" placeholder="Search products..." oninput="render()">
<select id="category" onchange="render()"><option value="">All categories</option></select>
</div>
</div></header>
<main class="wrap"><div id="grid" class="grid"></div></main>
<div class="cartbar"><div class="cartinner"><div><b id="count">0</b> items · <b id="total">UGX 0</b></div><button class="checkout" onclick="openCart()">View cart / Order</button></div></div>

<div id="modal" class="modal"><div class="panel">
<h2>Your order</h2><div id="cart"></div><hr>
<div class="form">
<label>Name</label><input id="customer" placeholder="Customer name">
<label>Phone</label><input id="phone" placeholder="07...">
<label>Location / delivery point</label><input id="location" placeholder="e.g. Kassanda town">
<label>Notes</label><textarea id="notes" rows="3" placeholder="Anything we should know?"></textarea>
</div>
<div class="row"><b>Total</b><b id="modalTotal">UGX 0</b></div>
<p class="small">This prototype prepares an order message. Payment and live stock checking will be added in the next version.</p>
<div class="row"><button onclick="closeCart()">Continue shopping</button><button class="checkout" onclick="sendOrder()">Send order</button></div>
</div></div>

<script>
const products = [{"category": "Cement", "name": "Simba", "variant": "", "price": 35000}, {"category": "Cement", "name": "Tororo", "variant": "", "price": 36000}, {"category": "Cement", "name": "Hima", "variant": "", "price": 34000}, {"category": "Iron sheets", "name": "Black", "variant": "", "price": 45000}, {"category": "Iron sheets", "name": "Red", "variant": "", "price": 45000}, {"category": "Iron sheets", "name": "Harvest Gold", "variant": "", "price": 45000}, {"category": "Nails", "name": "Katiko", "variant": "", "price": 7000}, {"category": "Nails", "name": "Nails", "variant": "2.5–6", "price": 5000}, {"category": "Nails", "name": "Nails", "variant": "1–2", "price": 6000}, {"category": "PVC pipe", "name": "PVC pipe", "variant": "2\"", "price": 20000}, {"category": "PVC pipe", "name": "PVC pipe", "variant": "2.5\"", "price": 20000}, {"category": "PVC pipe", "name": "PVC pipe", "variant": "3\"", "price": 25000}, {"category": "PVC pipe", "name": "PVC pipe", "variant": "4\"", "price": 30000}, {"category": "Locks", "name": "Bovos", "variant": "", "price": 40000}, {"category": "Locks", "name": "Parker", "variant": "", "price": 70000}, {"category": "Shattle pan", "name": "Shattle pan", "variant": "", "price": 25000}, {"category": "Paint", "name": "Twins", "variant": "", "price": 9000}, {"category": "Paint", "name": "Seweco", "variant": "1/2 ltr", "price": 9000}, {"category": "Paint", "name": "Sewevo", "variant": "4 ltrs", "price": 50000}, {"category": "Gloves", "name": "Gloves", "variant": "", "price": 5000}, {"category": "Reflector", "name": "Reflector", "variant": "", "price": 5000}, {"category": "Discs", "name": "Cutting", "variant": "", "price": 10000}, {"category": "Discs", "name": "Grinding", "variant": "", "price": 10000}, {"category": "Discs", "name": "Inco", "variant": "Small", "price": 2000}, {"category": "Door handle", "name": "Door handle", "variant": "", "price": 35000}, {"category": "Wood glue", "name": "Wood glue", "variant": "Small", "price": 3000}, {"category": "Wood glue", "name": "Wood glue", "variant": "Big", "price": 6000}, {"category": "Feveco", "name": "Feveco", "variant": "", "price": 9000}, {"category": "Floor brush", "name": "Floor brush", "variant": "Small", "price": 5000}, {"category": "Floor brush", "name": "Floor brush", "variant": "Medium", "price": 7000}, {"category": "Floor brush", "name": "Floor brush", "variant": "Big", "price": 10000}, {"category": "Mulpers", "name": "Mulpers", "variant": "", "price": 5000}, {"category": "Tanks", "name": "White", "variant": "", "price": 250000}, {"category": "Tanks", "name": "Black", "variant": "", "price": 250000}, {"category": "Drums", "name": "Drums", "variant": "Small", "price": 90000}, {"category": "Drums", "name": "Drums", "variant": "Unspecified", "price": 120000}, {"category": "Barbed wire", "name": "Barbed wire", "variant": "Small", "price": 120000}, {"category": "Barbed wire", "name": "Barbed wire", "variant": "Big", "price": 150000}, {"category": "Kale locks", "name": "Kale locks", "variant": "Sliding", "price": 25000}, {"category": "Kale locks", "name": "Kale locks", "variant": "Open", "price": 35000}, {"category": "Spray paint", "name": "Spray paint", "variant": "", "price": 15000}, {"category": "China stain", "name": "China stain", "variant": "Mahogany", "price": 9000}, {"category": "China stain", "name": "China stain", "variant": "Red oxide", "price": 9000}, {"category": "Ngalama", "name": "Ngalama", "variant": "", "price": 35000}, {"category": "Pick axe", "name": "Pick axe", "variant": "", "price": 15000}, {"category": "Axe", "name": "Axe", "variant": "Small", "price": 25000}, {"category": "Axe", "name": "Axe", "variant": "Big", "price": 30000}, {"category": "Spade", "name": "Spade", "variant": "", "price": 15000}, {"category": "Stove", "name": "Stove", "variant": "", "price": 10000}, {"category": "Panga", "name": "Panga", "variant": "", "price": 7000}, {"category": "Hoe", "name": "Hoe", "variant": "", "price": 10000}, {"category": "Building line", "name": "Building line", "variant": "", "price": 3000}, {"category": "Gate latch", "name": "Gate latch", "variant": "Big", "price": 10000}, {"category": "Gate latch", "name": "Gate latch", "variant": "Medium", "price": 5000}, {"category": "Gate latch", "name": "Gate latch", "variant": "Small", "price": 3000}, {"category": "Filler", "name": "Filler", "variant": "", "price": 30000}, {"category": "Thinner", "name": "Thinner", "variant": "", "price": 25000}, {"category": "PVC", "name": "PVC", "variant": "", "price": 5000}, {"category": "Waterproof", "name": "Waterproof", "variant": "", "price": 5000}, {"category": "Roovers", "name": "Roovers", "variant": "Big", "price": 6000}, {"category": "Roovers", "name": "Roovers", "variant": "Small", "price": 4000}, {"category": "Kigwogwa", "name": "Kigwogwa", "variant": "Big", "price": 5000}, {"category": "Kigwogwa", "name": "Kigwogwa", "variant": "Small", "price": 3000}, {"category": "Hungline", "name": "Hungline", "variant": "", "price": 5000}, {"category": "File", "name": "File", "variant": "Big", "price": 7000}, {"category": "File", "name": "File", "variant": "Small", "price": 5000}];
const cart = {};
const fmt = n => "UGX " + n.toLocaleString("en-UG");
function init(){
  const cats=[...new Set(products.map(p=>p.category))].sort();
  document.getElementById("category").innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${c}</option>`).join("");
  render();
}
function key(p){return p.category+"|"+p.name+"|"+p.variant}
function render(){
  const q=document.getElementById("search").value.toLowerCase(), cat=document.getElementById("category").value;
  const list=products.filter(p=>(!q || (p.category+" "+p.name+" "+p.variant).toLowerCase().includes(q)) && (!cat||p.category===cat));
  document.getElementById("grid").innerHTML=list.map(p=>{
    const k=key(p), n=cart[k]?.qty||0;
    const title=[p.name,p.variant].filter(Boolean).join(" — ");
    return `<div class="card"><div class="cat">${p.category}</div><div class="name">${title}</div><div class="price">${fmt(p.price)}</div>
    ${n?`<div class="qty"><button onclick='change(${JSON.stringify(k)},-1)'>−</button><span>${n}</span><button onclick='change(${JSON.stringify(k)},1)'>+</button></div>`:`<button class="add" onclick='add(${JSON.stringify(k)})'>Add to order</button>`}</div>`
  }).join("");
  updateBar();
}
function add(k){const p=products.find(x=>key(x)===k);cart[k]={p,qty:(cart[k]?.qty||0)+1};render()}
function change(k,d){if(!cart[k])return;cart[k].qty+=d;if(cart[k].qty<=0)delete cart[k];render()}
function totals(){let count=0,total=0;Object.values(cart).forEach(x=>{count+=x.qty;total+=x.qty*x.p.price});return {count,total}}
function updateBar(){const t=totals();document.getElementById("count").textContent=t.count;document.getElementById("total").textContent=fmt(t.total)}
function openCart(){const t=totals();if(!t.count){alert("Your order is empty.");return}document.getElementById("modal").style.display="block";renderCart()}
function closeCart(){document.getElementById("modal").style.display="none"}
function renderCart(){
 const items=Object.values(cart);
 document.getElementById("cart").innerHTML=items.map(x=>`<div class="row"><span>${x.p.category} — ${[x.p.name,x.p.variant].filter(Boolean).join(" ")} × ${x.qty}</span><b>${fmt(x.qty*x.p.price)}</b></div>`).join("");
 document.getElementById("modalTotal").textContent=fmt(totals().total);
}
function sendOrder(){
 const name=document.getElementById("customer").value.trim(), phone=document.getElementById("phone").value.trim(), loc=document.getElementById("location").value.trim();
 if(!name||!phone||!loc){alert("Please enter your name, phone and location.");return}
 let msg="*NEW ORDER — GERALD GENERAL HARDWARE*\\n\\n";
 Object.values(cart).forEach(x=>{
   msg+=`${x.p.category} - ${[x.p.name,x.p.variant].filter(Boolean).join(" ")} x ${x.qty} = ${fmt(x.qty*x.p.price)}\\n`;
 });
 msg+=`\\n*TOTAL: ${fmt(totals().total)}*\\nCustomer: ${name}\\nPhone: ${phone}\\nLocation: ${loc}\\nNotes: ${document.getElementById("notes").value}`;
 window.location.href="https://wa.me/256702582723?text="+encodeURIComponent(msg);
}
init();
</script>
</body></html>
